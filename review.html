<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e52"><link rel="manifest" href="manifest.json"><title>10 分钟复习 · UAV Detection Learning</title><link rel="stylesheet" href="assets/styles.css"><style>.review-page{padding:55px 0 120px;max-width:760px}.review-page h1{font:clamp(2.6rem,8vw,4.5rem)/1.05 Georgia;margin:10px 0}.review-lead{color:var(--muted)}.review-card{margin-top:28px;min-height:330px;border-radius:18px;background:var(--navy);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between}.review-card small{color:#9bc8c2;font-weight:800;letter-spacing:.1em}.review-card h2{font:clamp(1.7rem,6vw,2.7rem)/1.25 Georgia;margin:25px 0}.answer{display:none;padding:15px;background:rgba(255,255,255,.1);border-radius:10px}.answer.show{display:block}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.review-actions button{min-height:46px;padding:9px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff}.review-actions .primary{background:#fff;color:var(--navy)}.review-stats{font-size:.8rem;color:var(--muted);margin-top:12px}.bottom-nav{display:none}@media(max-width:600px){.site-header nav{display:none}.review-page{padding-top:32px}.review-card{padding:22px;min-height:390px}.bottom-nav{display:grid;position:fixed;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:5px}.bottom-nav a{min-height:52px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:1rem}.bottom-nav span{font-size:.62rem}.bottom-nav .active{color:var(--teal);font-weight:bold}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>UAV Detection Learning<small>Phase A · 快速复习</small></span></a><nav><a href="index.html">知识地图</a><a class="active" href="review.html">10 分钟复习</a><a href="progress.html">进度</a></nav></header><main class="review-page wrap"><span class="kicker">10-MINUTE REVIEW</span><h1>短一点，也算向前</h1><p class="review-lead">优先抽取你答错过的问题；若还没有弱项，则从 Phase A 随机选题。答案只需想清楚，不必死背。</p><section class="review-card"><div><small id="review-tag">REVIEW</small><h2 id="review-question">正在准备问题…</h2><div class="answer" id="review-answer"></div></div><div class="review-actions"><button class="primary" id="reveal">显示答案</button><button id="still-weak">仍然模糊</button><button id="understood">已经理解 · 下一题</button></div></section><p class="review-stats" id="review-stats"></p></main><nav class="bottom-nav"><a href="index.html">⌂<span>首页</span></a><a href="modules/01-image-tensor.html">▤<span>学习</span></a><a href="index.html#map-title">◇<span>地图</span></a><a class="active" href="review.html">↻<span>复习</span></a><a href="progress.html">✓<span>进度</span></a></nav><script src="assets/lesson-data.js"></script><script src="assets/quiz-extra.js"></script><script>const key='uav-phase-a-progress';let p={};try{p=JSON.parse(localStorage.getItem(key))||{}}catch{};const all=[];Object.values(LESSONS).forEach((m,mi)=>m.quiz.forEach((q,qi)=>all.push({m:mi+1,qi,q,weak:(p[mi+1]?.weak||[]).includes(qi)})));let deck=[...all.filter(x=>x.weak),...all.filter(x=>!x.weak).sort(()=>Math.random()-.5)].slice(0,8),n=0;function show(){if(n>=deck.length)n=0;const x=deck[n];document.querySelector('#review-tag').textContent=`MODULE 0${x.m} · ${x.weak?'弱项优先':'随机复习'}`;document.querySelector('#review-question').textContent=x.q[0];document.querySelector('#review-answer').textContent=x.q[1][x.q[2]]+'。'+x.q[3];document.querySelector('#review-answer').classList.remove('show');document.querySelector('#review-stats').textContent=`本轮第 ${n+1} / ${deck.length} 题 · 建议先口头回答，再显示答案`};document.querySelector('#reveal').onclick=()=>document.querySelector('#review-answer').classList.add('show');document.querySelector('#understood').onclick=()=>{const x=deck[n];if(p[x.m])p[x.m].weak=(p[x.m].weak||[]).filter(i=>i!==x.qi);localStorage.setItem(key,JSON.stringify(p));n++;show()};document.querySelector('#still-weak').onclick=()=>{const x=deck[n];p[x.m]??={status:'learning',quiz:[],weak:[]};if(!p[x.m].weak.includes(x.qi))p[x.m].weak.push(x.qi);localStorage.setItem(key,JSON.stringify(p));n++;show()};show()</script><script src="assets/pwa.js"></script></body></html>
