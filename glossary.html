<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>术语表 · Foundation v2</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/foundation.css"><style>.glossary{max-width:900px;margin:auto;padding:55px 18px}.glossary h1{font:4rem Georgia;margin:8px 0}.term{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:9px 0}.term h2{font:1.2rem Georgia;margin:0}.term small{color:var(--teal)}.term p{color:var(--muted);margin:8px 0}.term a{color:var(--teal);font-size:.8rem}.filter{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px;margin:20px 0}</style></head><body><main class="glossary"><a href="index.html">← 返回学习地图</a><span class="kicker" style="display:block;margin-top:35px">GLOSSARY</span><h1>术语表</h1><p>中文名、英文名、一句话定义、完整单元与相关前置。输入任意关键词筛选。</p><input class="filter" id="filter" placeholder="例如：梯度 / Gradient"><div id="terms"></div></main><script src="assets/foundation-math.js"></script><script src="assets/foundation-image.js"></script><script src="assets/foundation-nn.js"></script><script src="assets/foundation-cnn.js"></script><script>const files={math:'00-math.html',image:'01-image-tensor-v2.html',nn:'02-neural-networks.html',cnn:'03-cnn-v2.html'},all=Object.entries(FOUNDATION).flatMap(([k,m])=>m.units.map(u=>({...u,k})));function draw(q=''){terms.innerHTML=all.filter(u=>(u.zh+u.en+u.quick).toLowerCase().includes(q.toLowerCase())).map(u=>`<article class="term"><h2>${u.zh} <small>${u.en}</small></h2><p>${u.quick}</p><a href="modules/${files[u.k]}#${u.id}">完整单元 →</a>　<span>相关：${u.pre?.map(x=>all.find(y=>y.id===x)?.zh||x).join('、')||'无'}</span></article>`).join('')}filter.oninput=e=>draw(e.target.value);draw()</script><script src="assets/pwa.js"></script></body></html>
