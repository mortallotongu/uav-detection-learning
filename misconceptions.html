<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>常见误区 · Foundation v2</title><link rel="stylesheet" href="assets/styles.css"><style>.page{max-width:780px;margin:auto;padding:60px 18px}.page h1{font:clamp(2.7rem,8vw,4.8rem)/1.05 Georgia;margin:10px 0}.mis{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);padding:18px;border-radius:10px;margin:12px 0}.mis h2{font-size:1.05rem;margin:0}.mis p{color:var(--muted);margin-bottom:0}</style></head><body><main class="page"><a href="index.html">← 返回学习地图</a><span class="kicker" style="display:block;margin-top:35px">COMMON BEGINNER MISCONCEPTIONS</span><h1>常见初学者误区</h1><p>这个列表会随着 A2–A4 继续增长。先学会识别错误说法，再回到对应单元重建机制。</p><section id="list"></section></main><script>const data=[['Channel 不总是 RGB','输入图的 3 个通道可对应颜色；中间 64 个通道是学习表示，未必有单独可命名含义。'],['Feature Map 不是缩小图片','它是某种学习响应在空间位置上的网格，多通道共同表达信息。'],['Batch size 不是 epoch 数','Batch 是一次并行处理多少样本；epoch 是训练数据被遍历一轮。'],['Backward 不会自动更新参数','Backward 计算梯度；Optimizer 才读取梯度并更新参数。'],['Loss 不是最终评价指标','Loss 是训练优化目标；研究结论仍需独立数据和指标验证。'],['Padding 不会创造真实细节','它只规定边界外用什么值参与计算。'],['更多通道不等于更多物体','3→64 表示 64 组卷积核产生 64 类响应，不是检测了 64 个目标。'],['更高分辨率不保证更清晰','分辨率只描述采样网格；模糊和噪声不会因放大自动消失。']];list.innerHTML=data.map(x=>`<article class="mis"><h2>✕ ${x[0]}</h2><p>${x[1]}</p></article>`).join('')</script><script src="assets/pwa.js"></script></body></html>
