<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在更新 D-FINE Learning Studio…</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f0e8; color: #182f38; font-family: system-ui, sans-serif; }
      main { max-width: 340px; padding: 28px; text-align: center; } strong { display: block; margin-bottom: 10px; font-size: 1.1rem; } p { color: #51636a; line-height: 1.7; font-size: .9rem; }

  </head>
  <body><main><strong>正在清理旧版缓存</strong><p>完成后会自动回到新版 D-FINE Learning Studio，请不要关闭页面。</p></main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } finally {
          location.replace("./?v=cache-cleared-5795285");
        }
      })();
    </script>
  </body>
</html>
